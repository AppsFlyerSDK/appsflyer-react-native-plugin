def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

buildscript {
    repositories {
        mavenCentral()
        maven {
            url 'https://maven.google.com/'
            name 'Google'
        }
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.2.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.7.10" // Kotlin plugin
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android' // Apply Kotlin Android plugin
apply plugin: 'com.facebook.react'

def includeConnector = project.hasProperty('appsflyer.enable_purchase_connector') ? project.property('appsflyer.enable_purchase_connector').toBoolean() : false // Moved outside of android block

android {
    namespace "com.appsflyer.reactnative"
    compileSdkVersion safeExtGet('compileSdkVersion', 34)
    buildToolsVersion safeExtGet('buildToolsVersion', '34.0.0')

    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', 21)
        targetSdkVersion safeExtGet('targetSdkVersion', 34)
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }

        buildConfigField 'boolean', 'INCLUDE_CONNECTOR', includeConnector.toString()
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/java', 'src/main/kotlin'] // Add Kotlin source directory
            java.srcDirs += includeConnector ? ['src/main/includeConnector'] : ['src/main/excludeConnector']
        }
    }

    lintOptions {
        warning 'InvalidPackage'
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.returnDefaultValues = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { // Configure Kotlin-specific options
        jvmTarget = "17"
    }
}

repositories {
    mavenCentral()
    maven { url "https://maven.google.com" }
    // Phase A (research.md R8): plugin_bridge + a matching af-android-sdk build are not yet
    // published to Maven — vendored .aar files are resolved from android/libs/ via flatDir.
    // Phase B (once published): drop this flatDir block and the two `name:`-based
    // implementations below in favor of real `com.appsflyer:<artifact>:<version>` coordinates.
    flatDir { dirs 'libs' }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.7.10" // Add Kotlin standard library
    implementation "com.facebook.react:react-native:${safeExtGet('reactNativeVersion', '+')}"
    // af-android-sdk now comes from the vendored aars below (Phase A, research.md R8) —
    // NOT also from Maven, to avoid a duplicate-class conflict (plugin_bridge's af-android-sdk
    // build vs a separately-resolved Maven version). PCAppsFlyer compiles against this same
    // vendored SDK build.
    implementation "com.android.installreferrer:installreferrer:${safeExtGet('installReferrerVersion', '2.2')}"
    if (includeConnector){
        implementation 'com.appsflyer:purchase-connector:2.2.0'
    }

    // Phase A vendored RPC binaries (research.md R8) — af-android-sdk-base/dev.aar together
    // constitute af-android-sdk itself; af-android-plugin-bridge.aar is the RPC handler.
    // Phase B (once published): replace all three with real com.appsflyer:<artifact>:<version>
    // Maven coordinates and delete the vendored .aar files from android/libs/.
    api(name: 'af-android-sdk-base', ext: 'aar')
    api(name: 'af-android-sdk-dev', ext: 'aar')
    implementation(name: 'af-android-plugin-bridge', ext: 'aar')

    testImplementation 'junit:junit:4.13.2'
}