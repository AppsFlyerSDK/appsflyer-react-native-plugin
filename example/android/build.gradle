buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

// flatDir must be visible to the *consuming* project's (:app) dependency resolution, not just
// buildscript's own plugin classpath — a bare RN template has no `allprojects` block by default,
// so this is added specifically for react-native-appsflyer's vendored .aar files (Phase A;
// see android/build.gradle's own flatDir comment in the plugin repo root).
allprojects {
    repositories {
        flatDir {
            dirs "$rootDir/../node_modules/react-native-appsflyer/android/libs"
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
